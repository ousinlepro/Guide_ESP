<!doctype html>
<html lang="fr">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EFF3F1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B1413" media="(prefers-color-scheme: dark)">
<title>Cap ESP · Test d'entrée</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Source+Sans+3:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Mono:wght@400;600&display=swap">

<style>
:root{
  --bg:#EFF3F1; --surface:#FFFFFF; --surface2:#E4EAE7; --raise:#FAFCFB;
  --ink:#16211F; --ink2:#54635F; --ink3:#7E8D89;
  --line:#D2DBD7; --line2:#BCC8C4;
  --primary:#0B6B5F; --primary-ink:#075147; --primary-soft:#D9EAE6; --on-primary:#FFFFFF;
  --accent:#B96A15; --accent-soft:#F6E7D3;
  --ok:#2C7A5A; --ok-soft:#DCEDE4;
  --bad:#AE3F36; --bad-soft:#F6DFDC;
  --warn:#9C6410;
  --shadow:0 1px 2px rgba(16,40,36,.06),0 4px 14px rgba(16,40,36,.05);
  --r:12px;
  --f-disp:"Archivo","Segoe UI",system-ui,"Segoe UI Symbol","Noto Sans Symbols 2","DejaVu Sans",sans-serif;
  --f-body:"Source Sans 3","Segoe UI",system-ui,"Segoe UI Symbol","Noto Sans Symbols 2","DejaVu Sans",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"Cascadia Mono","Segoe UI Symbol",monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0B1413; --surface:#13201E; --surface2:#1C2A27; --raise:#182725;
    --ink:#E2EDE9; --ink2:#97A9A4; --ink3:#788A85;
    --line:#263633; --line2:#32463F;
    --primary:#4FC1AC; --primary-ink:#8FDDCD; --primary-soft:#153029; --on-primary:#06201C;
    --accent:#DFA157; --accent-soft:#33261A;
    --ok:#57BC8D; --ok-soft:#142E23;
    --bad:#E08279; --bad-soft:#33201E;
    --warn:#D6A44A;
    --shadow:0 1px 2px rgba(0,0,0,.35),0 4px 16px rgba(0,0,0,.28);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B1413; --surface:#13201E; --surface2:#1C2A27; --raise:#182725;
  --ink:#E2EDE9; --ink2:#97A9A4; --ink3:#788A85;
  --line:#263633; --line2:#32463F;
  --primary:#4FC1AC; --primary-ink:#8FDDCD; --primary-soft:#153029; --on-primary:#06201C;
  --accent:#DFA157; --accent-soft:#33261A;
  --ok:#57BC8D; --ok-soft:#142E23;
  --bad:#E08279; --bad-soft:#33201E;
  --warn:#D6A44A;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 4px 16px rgba(0,0,0,.28);
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
img{max-width:100%}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:var(--f-body); font-size:16px; line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:var(--f-disp); margin:0; text-wrap:balance; line-height:1.2}
p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--primary); outline-offset:2px; border-radius:6px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- Header ---------- */
.topbar{
  position:sticky; top:env(safe-area-inset-top,0px); z-index:40;
  background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
}
.topbar-in{
  max-width:1060px; margin:0 auto; padding:10px 16px;
  display:flex; align-items:center; gap:12px; flex-wrap:wrap;
}
.brand{display:flex; align-items:baseline; gap:9px; margin-right:auto; min-width:0}
.brand b{font-family:var(--f-disp); font-weight:700; font-size:19px; letter-spacing:-.01em}
.brand span{font-size:12px; color:var(--ink3); letter-spacing:.06em; text-transform:uppercase; white-space:nowrap}
.jchip{
  font-family:var(--f-mono); font-weight:600; font-size:13px;
  background:var(--primary); color:var(--on-primary); padding:5px 11px; border-radius:999px;
  white-space:nowrap;
}
.iconbtn{
  background:var(--surface); border:1px solid var(--line); border-radius:9px;
  width:34px; height:34px; cursor:pointer; display:grid; place-items:center; font-size:15px;
}
.iconbtn:hover{border-color:var(--line2)}

/* ---------- Nav ---------- */
.nav{border-bottom:1px solid var(--line); background:var(--surface)}
.nav-in{
  max-width:1060px; margin:0 auto; padding:0 16px;
  display:flex; gap:2px; overflow-x:auto; scrollbar-width:thin;
}
.nav button{
  background:none; border:0; border-bottom:2px solid transparent;
  padding:12px 12px 10px; cursor:pointer; white-space:nowrap;
  font-family:var(--f-disp); font-weight:500; font-size:14.5px; color:var(--ink2);
}
.nav button:hover{color:var(--ink)}
.nav button[aria-selected="true"]{color:var(--primary); border-bottom-color:var(--primary); font-weight:600}

/* ---------- Layout ---------- */
main{max-width:1060px; margin:0 auto; padding:22px 16px 60px}
.view{display:grid; gap:18px}
.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:18px}
.card.flat{box-shadow:none}
.card h2{font-size:17px; font-weight:600; letter-spacing:-.01em}
.card h3{font-size:15px; font-weight:600}
.sub{color:var(--ink2); font-size:14px}
.eyebrow{
  font-size:11px; letter-spacing:.1em; text-transform:uppercase;
  color:var(--ink3); font-family:var(--f-disp); font-weight:600;
}
.row{display:flex; gap:10px; flex-wrap:wrap; align-items:center}
.grow{flex:1 1 auto}

/* ---------- Countdown hero ---------- */
.hero{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
  padding:20px; display:grid; gap:16px; grid-template-columns:auto 1fr; align-items:center;
}
.hero-j{
  font-family:var(--f-disp); font-weight:700; font-size:54px; line-height:.92;
  color:var(--primary); letter-spacing:-.03em; font-variant-numeric:tabular-nums;
}
.hero-j small{display:block; font-size:12px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink3); font-weight:600; margin-top:6px}
.hero-txt h2{font-size:18px; margin-bottom:4px}
@media (max-width:520px){.hero{grid-template-columns:1fr} .hero-j{font-size:44px}}

/* ---------- Stat tiles ---------- */
.tiles{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px}
.tile{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:13px 14px}
.tile .v{font-family:var(--f-disp); font-weight:700; font-size:26px; letter-spacing:-.02em; font-variant-numeric:tabular-nums}
.tile .k{font-size:12.5px; color:var(--ink2); margin-top:1px}

/* ---------- Mastery bars ---------- */
.mast{display:grid; gap:12px}
.mast-row{display:grid; grid-template-columns:1fr auto; gap:4px 10px; align-items:baseline}
.mast-name{font-weight:600; font-size:14.5px; display:flex; align-items:center; gap:7px}
.coef{
  font-family:var(--f-mono); font-size:11px; font-weight:600;
  background:var(--surface2); color:var(--ink2); padding:1px 6px; border-radius:5px;
}
.mast-val{font-family:var(--f-mono); font-size:13px; color:var(--ink2); font-variant-numeric:tabular-nums}
.bar{grid-column:1/-1; height:8px; background:var(--surface2); border-radius:99px; overflow:hidden}
.bar i{display:block; height:100%; background:var(--primary); border-radius:99px; transition:width .4s ease}
.bar i.lo{background:var(--bad)} .bar i.mid{background:var(--accent)}

/* ---------- Buttons ---------- */
.btn{
  background:var(--primary); color:var(--on-primary); border:1px solid var(--primary);
  padding:9px 16px; border-radius:9px; cursor:pointer; font-weight:600; font-size:14.5px;
  font-family:var(--f-disp);
}
.btn:hover{filter:brightness(1.06)}
.btn.ghost{background:var(--surface); color:var(--ink); border-color:var(--line2)}
.btn.ghost:disabled{color:var(--ink3)}
.btn.ghost:hover{background:var(--surface2); filter:none}
.btn.sm{padding:6px 12px; font-size:13.5px}
.btn:disabled{opacity:.45; cursor:not-allowed}

/* ---------- Form controls ---------- */
label.fld{display:grid; gap:5px; font-size:13px; color:var(--ink2); font-weight:600}
select,input[type=number],textarea{
  font:inherit; font-size:14.5px; color:var(--ink);
  background:var(--surface); border:1px solid var(--line2); border-radius:9px; padding:8px 10px;
  width:100%;
}
textarea{font-family:var(--f-mono); font-size:12px; min-height:110px; resize:vertical}
.check{display:flex; gap:8px; align-items:center; font-size:14px; cursor:pointer}
.check input{width:17px; height:17px; accent-color:var(--primary); cursor:pointer; flex:none}
.grid3{display:grid; grid-template-columns:repeat(auto-fit,minmax(165px,1fr)); gap:12px}

/* ---------- Quiz ---------- */
.qhead{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:14px}
.qcount{font-family:var(--f-mono); font-size:13px; color:var(--ink2)}
.qtimer{font-family:var(--f-mono); font-size:15px; font-weight:600; padding:3px 10px; border-radius:7px; background:var(--surface2)}
.qtimer.urgent{background:var(--bad-soft); color:var(--bad)}
.qprog{height:4px; background:var(--surface2); border-radius:99px; overflow:hidden; margin-bottom:18px}
.qprog i{display:block; height:100%; background:var(--primary); transition:width .25s}
.qchap{font-size:12px; color:var(--ink3); font-family:var(--f-disp); font-weight:600; letter-spacing:.04em; text-transform:uppercase; margin-bottom:6px}
.qtext{font-size:18px; line-height:1.5; margin-bottom:16px}
.opts{display:grid; gap:8px}
.opt{
  display:grid; grid-template-columns:auto 1fr; gap:11px; align-items:start;
  background:var(--surface); border:1px solid var(--line2); border-radius:10px;
  padding:11px 13px; cursor:pointer; text-align:left; width:100%; font-size:15.5px; line-height:1.45;
}
.opt:hover:not(:disabled){border-color:var(--primary); background:var(--primary-soft)}
.opt .lt{
  font-family:var(--f-mono); font-weight:600; font-size:13px; color:var(--ink3);
  background:var(--surface2); width:23px; height:23px; border-radius:6px;
  display:grid; place-items:center; margin-top:1px;
}
.opt.sel{border-color:var(--primary); background:var(--primary-soft)}
.opt.sel .lt{background:var(--primary); color:var(--surface)}
.opt.good{border-color:var(--ok); background:var(--ok-soft)}
.opt.good .lt{background:var(--ok); color:var(--surface)}
.opt.wrong{border-color:var(--bad); background:var(--bad-soft)}
.opt.wrong .lt{background:var(--bad); color:var(--surface)}
.opt:disabled{cursor:default}
.expl{
  margin-top:14px; padding:13px 15px; border-radius:10px;
  background:var(--surface2); border-left:3px solid var(--primary); font-size:14.5px;
}
.expl b.v{color:var(--ok)} .expl b.x{color:var(--bad)}
.qnav{display:flex; gap:9px; flex-wrap:wrap; margin-top:16px; align-items:center}

/* grille de navigation (mode épreuve) */
.grid-nav{display:flex; flex-wrap:wrap; gap:5px; margin-top:14px}
.gn{
  width:30px; height:30px; border-radius:7px; border:1px solid var(--line2);
  background:var(--surface); font-family:var(--f-mono); font-size:12px; cursor:pointer;
}
.gn.done{background:var(--primary-soft); border-color:var(--primary)}
.gn.flag{background:var(--accent-soft); border-color:var(--accent)}
.gn.cur{outline:2px solid var(--primary); outline-offset:1px}

/* ---------- Résultats ---------- */
.score-big{font-family:var(--f-disp); font-weight:700; font-size:46px; letter-spacing:-.03em; font-variant-numeric:tabular-nums; line-height:1}
.score-big small{font-size:18px; color:var(--ink2); font-weight:500}
.verdict{display:inline-block; padding:4px 12px; border-radius:999px; font-size:13px; font-weight:600; font-family:var(--f-disp)}
.verdict.v-ok{background:var(--ok-soft); color:var(--ok)}
.verdict.v-mid{background:var(--accent-soft); color:var(--accent)}
.verdict.v-bad{background:var(--bad-soft); color:var(--bad)}
table.res{width:100%; border-collapse:collapse; font-size:14.5px}
table.res th,table.res td{text-align:left; padding:9px 11px; border-bottom:1px solid var(--line); vertical-align:middle}
table.res th{font-family:var(--f-disp); font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink3); font-weight:600; white-space:nowrap}
/* en-tete et cellule d'une colonne chiffree partagent le meme alignement */
table.res th.n,table.res td.n{text-align:right}
table.res td.n{font-family:var(--f-mono); font-variant-numeric:tabular-nums}
table.res tbody tr:last-child td{border-bottom:0}
table.res tbody tr:hover td{background:var(--surface2)}
.tw{overflow-x:auto}
.rev{display:grid; gap:10px}
.rev-item{border:1px solid var(--line); border-left:3px solid var(--bad); border-radius:9px; padding:12px 14px; background:var(--surface)}
.rev-item .q{font-size:15px; margin-bottom:6px}
.rev-item .a{font-size:14px; color:var(--ink2)}

/* ---------- Fiches ---------- */
details.fiche{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); overflow:hidden}
details.fiche+details.fiche{margin-top:10px}
details.fiche>summary{
  padding:13px 16px; cursor:pointer; font-family:var(--f-disp); font-weight:600; font-size:15.5px;
  display:flex; align-items:center; gap:10px; list-style:none;
}
details.fiche>summary::-webkit-details-marker{display:none}
details.fiche>summary::after{content:"+"; margin-left:auto; color:var(--ink3); font-family:var(--f-mono); font-size:17px}
details.fiche[open]>summary::after{content:"−"}
details.fiche[open]>summary{border-bottom:1px solid var(--line)}
.fiche-body{padding:4px 16px 16px}
.fiche-body h4{font-size:13px; text-transform:uppercase; letter-spacing:.07em; color:var(--primary); margin:16px 0 7px; font-weight:600}
.fiche-body ul{margin:0; padding-left:0; display:grid; gap:9px; list-style:none}
.fiche-body li{font-size:15px; line-height:1.62; padding-left:17px; position:relative}
.fiche-body li::before{content:""; position:absolute; left:3px; top:.68em; width:5px; height:5px;
  border-radius:50%; background:var(--line2)}
.fiche-body li.fxi{padding-left:0}
.fiche-body li.fxi::before{display:none}
.fxg{display:grid; gap:7px}
.fiche-tab{border-collapse:collapse; width:100%; font-size:15px; font-variant-numeric:tabular-nums}
.fiche-tab th,.fiche-tab td{border-bottom:1px solid var(--line); padding:7px 8px; text-align:center; line-height:1.5}
.fiche-tab thead th{font-family:var(--f-disp); font-size:12.5px; color:var(--primary); font-weight:600; border-bottom-color:var(--line2)}
.fiche-tab tbody th{text-align:left; font-weight:600; color:var(--ink2); white-space:nowrap}
.fiche-tab tbody tr:last-child th,.fiche-tab tbody tr:last-child td{border-bottom:0}
.fx{background:var(--surface2); border-radius:9px; padding:9px 13px; font-size:15px;
  line-height:1.8; border-left:2px solid var(--primary)}
@media (min-width:700px){.fxg.duo{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tag{
  font-family:var(--f-mono); font-size:10.5px; font-weight:600; text-transform:uppercase;
  letter-spacing:.05em; padding:2px 7px; border-radius:5px; background:var(--surface2); color:var(--ink2);
}
.tag.m{background:var(--primary-soft); color:var(--primary-ink)}
.tag.p{background:var(--accent-soft); color:var(--accent)}

/* ---------- Plan ---------- */
.day{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:14px 16px}
.day+.day{margin-top:9px}
.day.today{border-color:var(--primary); box-shadow:0 0 0 2px var(--primary-soft)}
.day.past{opacity:.55}
.day.test{border-left:4px solid var(--accent)}
.day.jourj{border-left:4px solid var(--primary); background:var(--primary-soft)}
.day-h{display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; margin-bottom:9px}
.day-j{font-family:var(--f-mono); font-weight:600; font-size:14px; color:var(--primary)}
.day-d{font-size:13.5px; color:var(--ink2); text-transform:capitalize}
.day-p{margin-left:auto; font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; font-family:var(--f-disp); font-weight:600; color:var(--ink3)}
.task{display:flex; gap:9px; align-items:flex-start; font-size:14.5px; padding:3px 0; cursor:pointer}
.task input{margin-top:4px; width:16px; height:16px; accent-color:var(--primary); cursor:pointer; flex:none}
.task.done span{text-decoration:line-through; color:var(--ink3)}

/* ---------- Infos ---------- */
.kv{display:grid; grid-template-columns:auto 1fr; gap:7px 16px; font-size:14.5px}
.kv dt{font-weight:600; color:var(--ink2)}
.kv dd{margin:0}
.note{background:var(--accent-soft); border-left:3px solid var(--accent); padding:12px 15px; border-radius:9px; font-size:14.5px}
a{color:var(--primary)}
.src{font-size:13px; color:var(--ink2); display:grid; gap:4px}
.empty{text-align:center; padding:34px 16px; color:var(--ink3)}
/* ===================== Responsive : Android, tablettes, paysage ===================== */
:root{--cp:18px; --gut:16px; --tb:0px}
html{scroll-padding-top:calc(var(--tb) + 12px)}
button,select,summary,label.task,label.check{touch-action:manipulation; -webkit-tap-highlight-color:transparent}
.view>*{min-width:0}
.card{padding:var(--cp)}
.opt{grid-template-columns:auto minmax(0,1fr)}
.qtext,.opt span,.expl,.fiche-body li,.rev-item .q,.rev-item .a,.task span,.kv dd{overflow-wrap:anywhere}
.grid3{grid-template-columns:repeat(auto-fit,minmax(min(100%,165px),1fr))}
.tiles{grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr))}

/* marges de sécurité latérales (encoches, écrans incurvés, paysage) */
.topbar-in,.nav-in,main{
  padding-left:max(var(--gut),env(safe-area-inset-left,0px));
  padding-right:max(var(--gut),env(safe-area-inset-right,0px));
}

/* onglets : défilement tactile + indice de débordement */
.nav-in{scroll-snap-type:x proximity; -webkit-overflow-scrolling:touch; overscroll-behavior-x:contain}
.nav button{scroll-snap-align:center; flex:none}
@media (max-width:900px){
  .nav-in{
    -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 10px,#000 calc(100% - 20px),transparent 100%);
    mask-image:linear-gradient(90deg,transparent 0,#000 10px,#000 calc(100% - 20px),transparent 100%);
  }
}

/* champs : 16 px évite le zoom automatique des navigateurs mobiles */
select,input[type=number],textarea{font-size:16px}
select{min-height:44px}

/* en-tête de question collant : chrono toujours visible */
.qhead{
  position:sticky; top:calc(env(safe-area-inset-top,0px) + var(--tb)); z-index:15;
  background:var(--surface);
  margin:calc(var(--cp) * -1) calc(var(--cp) * -1) 12px;
  padding:12px var(--cp) 10px;
  border-bottom:1px solid var(--line);
  border-radius:var(--r) var(--r) 0 0;
}
/* barre d'actions collée en bas : « Suivante » reste sous le pouce */
.qnav{
  position:sticky; bottom:0; z-index:15; background:var(--surface);
  margin:16px calc(var(--cp) * -1) 0;
  padding:10px var(--cp) calc(10px + env(safe-area-inset-bottom,0px));
  border-top:1px solid var(--line);
}
.qnav:last-child{margin-bottom:calc(var(--cp) * -1); border-radius:0 0 var(--r) var(--r)}
.sh{display:none}

/* écrans tactiles : cibles d'au moins 44 px, pas de survol collant.
   any-pointer couvre les tablettes avec clavier ; la largeur couvre les
   téléphones qui annoncent mal leur pointeur */
@media (pointer:coarse),(any-pointer:coarse),(max-width:640px){
  .iconbtn{width:44px; height:44px}
  .nav-in{scrollbar-width:none}
  .nav-in::-webkit-scrollbar{display:none}
  .nav button{padding:14px 14px 12px}
  .btn,.btn.sm{min-height:44px; padding-top:8px; padding-bottom:8px}
  .opt{min-height:52px; padding:13px 14px}
  .gn{width:42px; height:42px; font-size:13px}
  .grid-nav{gap:7px}
  .check{min-height:44px}
  .check input,.task input{width:22px; height:22px}
  .task{padding:8px 0; gap:12px}
  details.fiche>summary{padding:16px}
  select,textarea{min-height:46px}
}
@media (hover:none){
  .opt:hover:not(:disabled):not(.sel){border-color:var(--line2); background:var(--surface)}
  .btn.ghost:hover{background:var(--surface)}
}

/* ---------- téléphone ---------- */
@media (max-width:640px){
  :root{--cp:14px}
  .topbar{position:static}
  main{padding-top:14px; padding-bottom:40px}
  .brand span{display:none}
  .card h2{font-size:16.5px}
  .qtext{font-size:17.5px; margin-bottom:14px}
  .opt{font-size:15.5px; gap:10px}
  .hero{padding:16px}

<script>
(function(){
"use strict";

/* ===================== Constantes ===================== */
var TEST_DATE = new Date(2026,9,17);           // 17 octobre 2026
var MAT = {
  maths:    {nom:"Mathématiques", coef:3, court:"Maths"},
  physique: {nom:"Physique",      coef:3, court:"Physique"},
  francais: {nom:"Français",      coef:2, court:"Français"},
  anglais:  {nom:"Anglais",       coef:1, court:"Anglais"}
};
var ORDRE = ["maths","physique","francais","anglais"];
var NOTES = ["A","B","C","D","E","F"];
var B = window.BANQUE || {};
ORDRE.forEach(function(m){ (B[m]||[]).forEach(function(q){ q.mat=m; }); });
function all(m){ return B[m] || []; }
function every(){ var r=[]; ORDRE.forEach(function(m){ r=r.concat(all(m)); }); return r; }
var BYID={}; every().forEach(function(q){ BYID[q.id]=q; });

/* ===================== État persistant ===================== */
var KEY="capesp.v2";   /* v2 : repart d'une progression vierge */
var S = {stats:{}, sessions:[], plan:{}, theme:null, session:null};
try{ var raw=localStorage.getItem(KEY); if(raw){ var p=JSON.parse(raw); if(p&&typeof p==="object"){
  S.stats=p.stats||{}; S.sessions=p.sessions||[]; S.plan=p.plan||{}; S.theme=p.theme||null;
  S.session=p.session||null; } } }catch(e){}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
function st(id){ if(!S.stats[id]) S.stats[id]={seen:0,ok:0,ko:0,box:0}; return S.stats[id]; }

/* ===================== Thème ===================== */
function applyTheme(){ if(S.theme) document.documentElement.setAttribute("data-theme",S.theme);
  else document.documentElement.removeAttribute("data-theme"); }
applyTheme();
document.getElementById("themebtn").addEventListener("click",function(){
  var cur=S.theme;
  S.theme = cur==="dark" ? "light" : cur==="light" ? null : "dark";
  applyTheme(); save();
});

/* ===================== Utilitaires ===================== */
function selw(sel){ var w=el("span","selw"); w.appendChild(sel); return w; }
function el(tag,cls,html){ var e=document.createElement(tag); if(cls)e.className=cls;
  if(html!=null)e.innerHTML=html; return e; }
function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1));
  var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function pad(n){ return n<10?"0"+n:""+n; }
function reduit(){ try{ return matchMedia("(prefers-reduced-motion: reduce)").matches; }catch(e){ return false; } }
function anime(node, to, fmt){
  if(reduit() || !window.requestAnimationFrame){ node.textContent = fmt(to); return; }
  var t0 = 0;
  requestAnimationFrame(function step(ts){
    if(!t0) t0 = ts;
    var p = Math.min(1, (ts - t0) / 600), e = 1 - Math.pow(1 - p, 3);
    node.textContent = fmt(to * e);
    if(p < 1) requestAnimationFrame(step);
  });
}
function mmss(s){ s=Math.max(0,Math.round(s)); var h=Math.floor(s/3600), m=Math.floor(s%3600/60), x=s%60;
  return (h>0? h+":"+pad(m) : m)+":"+pad(x); }
function joursRestants(){
  var t=new Date(); t.setHours(0,0,0,0);
  return Math.max(0, Math.round((TEST_DATE-t)/86400000));
}
function todayISO(){ var d=new Date(); return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }

/* Mélange les options en conservant la bonne réponse */
function prepare(q){
  var idx=q.o.map(function(_,i){return i;});
  idx=shuffle(idx);
  /* idx est conservé : il permet de retrouver l'option d'ORIGINE choisie,
     donc l'explication qui lui correspond dans POURQUOI. */
  return {ref:q, idx:idx, opts:idx.map(function(i){return q.o[i];}), bonne:idx.indexOf(q.r)};
}

/* ===================== Formateur de fractions =====================
   Les balises sont mises a l'abri derriere des jetons avant analyse : une
   fraction ne peut donc ni s'empiler dans un exposant ni chevaucher une balise. */

var CH   = "[A-Za-z0-9\\u00C0-\\u00FF\\u0391-\\u03C9\\u00B2\\u00B3\\u2070-\\u209F\\u221A\\u2032\\u2033!|\\u0394\\u03A9,.\\u2212+\\-\\uE000\\uE001]";
var IN   = "[^()\\[\\]<>/]";
var PAR1 = "\\(" + IN + "*\\)";
var PAR2 = "\\((?:" + PAR1 + "|" + IN + ")*\\)";
var BRK  = "\\[(?:" + PAR2 + "|[^\\[\\]<>/])*\\]";
var GRP  = "(?:" + PAR2 + "|" + BRK + ")";
// un membre peut porter un prefixe (sin, ln, f...) et enchainer plusieurs groupes
var UNIT = "(?:" + CH + "*(?:" + GRP + CH + "*)+|" + CH + "+)";
var RE_FRAC = new RegExp("(" + UNIT + ")\\/(" + UNIT + ")", "g");

var UNITES = /^(?:m|km|cm|mm|nm|pm|fm|rad|tr|N|J|C|V|A|W|Wb|T|H|F|Hz|kg|g|mg|mol|L|Pa|eV|MeV|keV|kW|kWh|Bq|s|h|min|K|dB|s²|m²|m³)$/;
var MOTS = /^(?:et|ou|de|du|la|le|les|un|une|des|par|sur|non|oui|and|or)$/i;

function nu(s){ // retire une paire de parentheses ou crochets enveloppante
  var o = s.charAt(0), c = s.charAt(s.length - 1);
  if(s.length > 1 && ((o === "(" && c === ")") || (o === "[" && c === "]"))){
    var d = 0;
    for(var i = 0; i < s.length; i++){
      var ch = s.charAt(i);
      if(ch === "(" || ch === "[") d++;
      else if(ch === ")" || ch === "]"){ d--; if(d === 0 && i < s.length - 1) return s; }
    }
    return s.slice(1, -1);
  }
  return s;
}

function frac(s, store, depth){
  return s.replace(RE_FRAC, function(m, a, b, off, whole){
    var head = "", tail = "";
    var mh = /^[·×*]+/.exec(a);              // « ·  » multiplicatif : hors fraction
    if(mh){ head = mh[0]; a = a.slice(head.length); }
    var mt = /[.,;:]+$/.exec(b);                       // ponctuation de phrase : hors fraction
    if(mt){ tail = mt[0]; b = b.slice(0, b.length - tail.length); }
    if(!a.length || !b.length) return m;

    var vis = function(x){                             // texte reellement visible
      return x.replace(/(\d+)/g, function(_, i){ return store[+i]; })
              .replace(/<[^>]*>/g, "");
    };
    var ta = vis(a), tb = vis(b);
    if(!ta.length || !tb.length) return m;
    if(ta.length > 30 || tb.length > 30) return m;     // illisible une fois empile
    if(UNITES.test(ta) && UNITES.test(tb)){            // « 340 m/s »
      var av = vis(whole.slice(0, off)).replace(/\s+$/, "");
      if(/[0-9π²³)]$/.test(av)) return m;
    }
    if(a.indexOf("") < 0 && b.indexOf("") < 0 &&
       /^[A-Za-zÀ-ÿ]{2,}$/.test(ta) && /^[A-Za-zÀ-ÿ]{2,}$/.test(tb) &&
       (MOTS.test(ta) || MOTS.test(tb))) return m;     // « et/ou »

    var na = nu(a), nb = nu(b);
    if(!vis(na).length || !vis(nb).length) return m;
    if(depth < 2){ na = frac(na, store, depth + 1); nb = frac(nb, store, depth + 1); }
    return head + '<span class="fr"><i>' + na + '</i><i>' + nb + '</i></span>' + tail;
  });
}

/* « AB⃗ » : la fleche coiffe les deux lettres ; sinon une seule. */
function vecteurs(html){
  if(html.indexOf("\u20d7") < 0) return html;
  return html.replace(/([A-Z][A-Z])\u20d7/g, '<span class="vec">$1</span>')
             .replace(/([^\s<>])\u20d7/g, '<span class="vec">$1</span>');
}

function mathify(html){
  if(!html) return html;
  html = vecteurs(html);
  if(html.indexOf("/") < 0) return html;
  var store = [];
  var keep = function(t){ store.push(t); return "" + (store.length - 1) + ""; };
  // indices et exposants mis a l'abri AVEC leur contenu
  var s = html.replace(/<(sub|sup)>[\s\S]*?<\/(?:sub|sup)>/g, keep).replace(/<[^>]+>/g, keep);
  s = frac(s, store, 0);
  return s.replace(/(\d+)/g, function(_, i){ return store[+i]; });
}

/* ===================== Statistiques ===================== */
function statsMat(m){
  var qs=all(m), vus=0, ok=0, maitrise=0, tot=qs.length;
  qs.forEach(function(q){ var s=S.stats[q.id]; if(!s) return;
    if(s.seen>0){ vus++; ok+=s.ok; } if(s.box>=2) maitrise++; });
  var rep=0; qs.forEach(function(q){ var s=S.stats[q.id]; if(s) rep+=s.seen; });
  return {tot:tot, vus:vus, rep:rep, ok:ok, maitrise:maitrise,
          pctMaitrise: tot? Math.round(100*maitrise/tot):0,
          pctReussite: rep? Math.round(100*ok/rep):0};
}
function statsGlobal(){
  var rep=0, ok=0, mait=0, tot=0;
  ORDRE.forEach(function(m){ var s=statsMat(m); rep+=s.rep; ok+=s.ok; mait+=s.maitrise; tot+=s.tot; });
  return {rep:rep, ok:ok, mait:mait, tot:tot, pct: rep? Math.round(100*ok/rep):0};
}
function listeErreurs(){
  return every().filter(function(q){ var s=S.stats[q.id]; return s && s.ko>0 && s.box<2; });
}

/* ===================== Hauteur de l'en-tête collant ===================== */
var TOPBAR=document.querySelector(".topbar");
function mesure(){
  var h = (TOPBAR && getComputedStyle(TOPBAR).position==="sticky") ? TOPBAR.offsetHeight : 0;
  document.documentElement.style.setProperty("--tb", h+"px");
}
window.addEventListener("resize",mesure);
window.addEventListener("orientationchange",mesure);
try{ if(document.fonts && document.fonts.ready) document.fonts.ready.then(mesure); }catch(e){}
mesure();

/* ===================== Correction à deux niveaux ===================== */
function memoDe(q){ return (window.MEMOS || {})[q.ch] || null; }
function pourquoiDe(q, orig){
  var t = (window.POURQUOI || {})[q.id];
  return (t && orig >= 1 && orig <= 3) ? t[orig - 1] : null;
}
function carteRep(cls, role, lettre, texte, raison){
  var d = el("div", "cmp " + cls);
  d.innerHTML = '<div class="cmp-r">' + role + '</div>' +
    '<div class="cmp-h"><span class="cmp-lt">' + lettre + '</span><span>' + mathify(texte) + '</span></div>' +
    (raison ? '<div class="cmp-w">' + mathify(raison) + '</div>' : '');
  return d;
}
/* Le détail : comparaison des deux réponses, puis formules, méthode,
   pièges et schéma du chapitre. */
function blocDetail(q, origChoisi, lettreChoisie, texteChoisi, lettreBonne){
  var box = el("div", "detail");
  if(origChoisi != null && origChoisi !== q.r){
    box.appendChild(el("h5", null, "Ta réponse face à la bonne réponse"));
    var g = el("div", "cmpg");
    g.appendChild(carteRep("ko", "Ce que tu as coché", lettreChoisie, texteChoisi, pourquoiDe(q, origChoisi)));
    g.appendChild(carteRep("ok", "La bonne réponse", lettreBonne, q.o[q.r], q.e));
    box.appendChild(g);
  }
  var m = memoDe(q);
  if(m){
    if(m.f && m.f.length){
      box.appendChild(el("h5", null, "Formules à retenir"));
      var fg = el("div", "fxg");
      m.f.forEach(function(x){ fg.appendChild(el("div", "fx", mathify(x))); });
      box.appendChild(fg);
    }
    if(m.m){
      box.appendChild(el("h5", null, "La méthode"));
      box.appendChild(el("p", "dtxt", mathify(m.m)));
    }
    if(m.p && m.p.length){
      box.appendChild(el("h5", null, "Erreurs fréquentes sur ce chapitre"));
      var ul = el("ul", "dlist");
      m.p.forEach(function(x){ ul.appendChild(el("li", null, mathify(x))); });
      box.appendChild(ul);
    }
    var sc = m.s && window.SCHEMAS ? window.SCHEMAS[m.s] : null;

      var fig = el("figure", "dfig");
      fig.innerHTML = sc.svg + '<figcaption>' + mathify(sc.cap) + '</figcaption>';
      box.appendChild(fig);
    }
  }
  return box;
}
function blocCorrection(it, repK, ouvert){
  var q = it.ref, juste = repK === it.bonne;
  var w = el("div", "corr");
  var e1 = el("div", "expl " + (juste ? "eok" : "eko"));

                 + mathify(q.e);
  w.appendChild(e1);
  var d = blocDetail(q,
    repK == null ? null : it.idx[repK],
    repK == null ? "—" : NOTES[repK],
    repK == null ? "Tu n'as pas répondu à cette question." : it.opts[repK],

  d.hidden = !ouvert;

  w.appendChild(b);

  return w;
}

/* ===================== Série interrompue ===================== */
function sauverSession(){
  if(!Q || Q.fini || !Q.liste){ return; }
  S.session = {mode:Q.mode, lib:Q.lib, malus:!!Q.malus, reste:Q.reste, i:Q.i, max:Q.max || 0,
    ids:Q.liste.map(function(it){ return it.ref.id; }),
    perms:Q.liste.map(function(it){ return it.idx; }),
    rep:Q.rep, flag:Q.flag, date:todayISO()};
  save();
}
function reprendreSession(){
  var x = S.session; if(!x) return;
  var liste = [], ok = true;
  x.ids.forEach(function(id, k){
    var q = BYID[id], idx = x.perms[k];
    if(!q || !idx){ ok = false; return; }
    liste.push({ref:q, idx:idx, opts:idx.map(function(i){ return q.o[i]; }), bonne:idx.indexOf(q.r)});
  });
  if(!ok){
    alert("Cette série ne peut plus être rechargée : la banque de questions a changé depuis.");
    S.session = null; save(); go("bord"); return;
  }
  go(x.mode === "blanc" ? "blanc" : "train");
  Q = {mode:x.mode, lib:x.lib, liste:liste, i:Math.min(x.i, liste.length - 1),
       rep:x.rep, flag:x.flag, malus:!!x.malus,
       cible:(x.mode === "blanc" ? "v-blanc" : "v-train"),
       reste:x.reste || 0, fini:false, max:x.max || 0, t:0};
  quizEnCours = true;
  if(Q.reste > 0) demarrerChrono();
  dessinerQuestion();
}
function banniereReprise(v){
  var x = S.session; if(!x) return;
  var faits = x.rep.filter(function(r){ return r !== null; }).length;
  var c = el("div", "card resume");
  c.appendChild(el("div", "eyebrow", "Série interrompue"));
  c.appendChild(el("h2", "", x.lib));
  c.appendChild(el("p", "sub", faits + " réponse" + (faits > 1 ? "s" : "") + " sur " + x.ids.length +
    (x.reste > 0 ? " · il restait " + mmss(x.reste) + " au chrono" : "") + "."));
  var r = el("div", "row"); r.style.marginTop = "13px";
  var b1 = el("button", "btn", "Reprendre où j'en étais"); b1.type = "button";
  b1.addEventListener("click", reprendreSession);
  var b2 = el("button", "btn ghost", "Abandonner"); b2.type = "button";
  b2.addEventListener("click", function(){
    if(!confirm("Abandonner cette série ?\n\nLes questions déjà répondues restent comptées dans ta progression.")) return;
    S.session = null; save(); go(actif);
  });
  r.appendChild(b1); r.appendChild(b2);
  c.appendChild(r);
  v.appendChild(c);
}

function lancerEntrainement(mat,chap,diff,nb){
  var qs = mat==="_mix" ? every() : all(mat);
  if(chap && chap!=="*") qs=qs.filter(function(q){return q.ch===chap;});
  if(diff) qs=qs.filter(function(q){return q.d===diff;});
  if(!qs.length){ alert("Aucune question ne correspond à ces filtres."); return; }
  /* priorité aux questions jamais vues ou ratées */
  qs=shuffle(qs).sort(function(a,b){
    var sa=S.stats[a.id]||{box:0,seen:0}, sb=S.stats[b.id]||{box:0,seen:0};
    return (sa.box - sb.box) || (sa.seen - sb.seen);
  });
  demarrer({
    mode:"train",
    lib: mat==="_mix" ? "Série mixte" : MAT[mat].nom + (chap&&chap!=="*" ? " · "+chap : ""),
    liste: qs.slice(0,nb).map(prepare),
    duree: 0, cible:"v-train"
  });
}

/* ===================== Moteur de quiz ===================== */
var Q=null, quizEnCours=false, timerId=null;

function stopTimer(){ if(timerId){ clearInterval(timerId); timerId=null; } }

function demarrerChrono(){
  stopTimer();
  timerId=setInterval(function(){
    Q.reste--;
    var t=document.getElementById("qtimer");
    if(t){ t.textContent=mmss(Q.reste); if(Q.reste<300) t.className="qtimer urgent"; }
    if(Q.reste % 15 === 0) sauverSession();      /* le chrono survit à une fermeture */
    if(Q.reste<=0){ stopTimer(); terminer(); }
  },1000);
}

function demarrer(cfg){
  Q={ mode:cfg.mode, lib:cfg.lib, liste:cfg.liste, i:0,
      rep:new Array(cfg.liste.length).fill(null),
      flag:new Array(cfg.liste.length).fill(false),
      malus:!!cfg.malus, cible:cfg.cible,
      reste:cfg.duree, fini:false };
  quizEnCours=true;
  if(cfg.duree>0) demarrerChrono();
  dessinerQuestion();
}

function dessinerQuestion(){
  var v=document.getElementById(Q.cible); v.innerHTML="";
  var it=Q.liste[Q.i], q=it.ref, rep=Q.rep[Q.i];
  Q.t = Date.now();                                   // horodatage : protège « Suivante » du double-clic
  Q.max = Math.max(Q.max || 0, Q.i);                  // question la plus avancée déjà atteinte
  var c=el("div","card");

  /* en-tête */
  var h=el("div","qhead");
  h.appendChild(el("div","eyebrow",Q.lib));
  var sp=el("div","grow"); h.appendChild(sp);
  h.appendChild(el("div","qcount",(Q.i+1)+" / "+Q.liste.length));
  if(Q.reste>0 || Q.mode==="blanc"){
    var tm=el("div","qtimer",mmss(Q.reste)); tm.id="qtimer";
    if(Q.reste<300) tm.className="qtimer urgent";
    h.appendChild(tm);
  }
  c.appendChild(h);

  var pr=el("div","qprog");
  var done=Q.rep.filter(function(x){return x!==null;}).length;
  pr.innerHTML='<i style="width:'+Math.round(100*done/Q.liste.length)+'%"></i>';
  c.appendChild(pr);

  c.appendChild(el("div","qchap", MAT[q.mat].court+" · "+q.ch+(q.d===2?" · renforcé":"")));
  c.appendChild(el("div","qtext", mathify(q.q)));

  var opts=el("div","opts");
  it.opts.forEach(function(txt,k){
    var b=el("button","opt");
    b.type="button";
    b.innerHTML='<span class="lt">'+NOTES[k]+'</span><span>'+mathify(txt)+'</span>';
    if(Q.mode==="train" && rep!==null){
      b.disabled=true;
      if(k===it.bonne) b.className="opt good";
      else if(k===rep) b.className="opt wrong";
    }else if(rep===k){ b.className="opt sel"; }
    b.addEventListener("click",function(){ repondre(k); });
    opts.appendChild(b);
  });
  c.appendChild(opts);

  /* correction en mode entraînement : explication courte puis « Voir plus » */
  if(Q.mode==="train" && rep!==null) c.appendChild(blocCorrection(it, rep, false));

  /* questions sautées : passées sans réponse, avec accès direct */
  if(Q.mode==="train"){
    var sautees=[];
    Q.rep.forEach(function(x,k){ if(x===null && k<Q.max && k!==Q.i) sautees.push(k); });
    if(sautees.length){
      var bn=el("div","skipn");
      bn.appendChild(el("span",null, sautees.length===1 ? "1 question sautée :" : sautees.length+" questions sautées :"));
      sautees.slice(0,8).forEach(function(k){
        var lk=el("button","gn flag","n°"+(k+1)); lk.type="button";
        lk.setAttribute("aria-label","Aller à la question "+(k+1));
        lk.addEventListener("click",function(){ Q.i=k; dessinerQuestion(); });
        bn.appendChild(lk);
      });
      c.appendChild(bn);
    }
  }

  /* navigation */
  var nv=el("div","qnav");
  if(Q.i>0){ var pb=el("button","btn ghost sm",'<span class="sh">←</span><span class="lg">← Précédente</span>'); pb.type="button"; pb.setAttribute("aria-label","Question précédente");
    pb.addEventListener("click",function(){ Q.i--; dessinerQuestion(); }); nv.appendChild(pb); }
  if(Q.mode==="blanc"){
    var fb=el("button","btn ghost sm", Q.flag[Q.i]?'<span class="sh">★</span><span class="lg">★ Marquée</span>':'<span class="sh">☆</span><span class="lg">☆ Marquer</span>'); fb.type="button"; fb.setAttribute("aria-label",Q.flag[Q.i]?"Retirer le marquage":"Marquer cette question");
    fb.addEventListener("click",function(){ Q.flag[Q.i]=!Q.flag[Q.i]; dessinerQuestion(); });
    nv.appendChild(fb);
  }
  if(Q.i<Q.liste.length-1){
    var nb2=el("button", (Q.mode==="train"&&rep===null)?"btn ghost sm":"btn sm", "Suivante →"); nb2.type="button";
    nb2.addEventListener("click",function(){

      if(Date.now()-Q.t < 250) return;
      Q.i++; dessinerQuestion();
    });
    nv.appendChild(nb2);
  }
  nv.appendChild(el("div","grow"));
  var qb=el("button","btn ghost sm",
    '<span class="sh">Pause</span><span class="lg">Enregistrer et quitter</span>');

  tb.type="button";

    var vides=[]; Q.rep.forEach(function(x,k){ if(x===null) vides.push(k+1); });
    if(vides.length){
      var qui = vides.length<=6 ? " (n°"+vides.join(", n°")+")" : "";
      if(!confirm(vides.length+" question"+(vides.length>1?"s":"")+" sans réponse"+qui+
                  ". Terminer quand même ?\n\nAnnuler pour y revenir.")) return;

function repondre(k){
  var it=Q.liste[Q.i];
  if(Q.mode==="train"){
    if(Q.rep[Q.i]!==null) return;               // une seule tentative
    Q.rep[Q.i]=k;
    var s=st(it.ref.id);
    s.seen++;
    if(k===it.bonne){ s.ok++; s.box=Math.min(3,s.box+1); }
    else { s.ko++; s.box=0; s.last=it.idx[k]; }   /* retenue pour « Mes erreurs » */
    save();
    dessinerQuestion();
  }else{
    Q.rep[Q.i]=k;
    if(Q.i<Q.liste.length-1){ Q.i++; dessinerQuestion(); }
    else dessinerQuestion();
  }
}

function terminer(){
  stopTimer(); quizEnCours=false; Q.fini=true;
  S.session=null;

  /* En mode épreuve, les statistiques sont enregistrées à la correction */
  if(Q.mode==="blanc"){
    Q.liste.forEach(function(it,k){
      var s=st(it.ref.id); s.seen++;
      if(Q.rep[k]===it.bonne){ s.ok++; s.box=Math.min(3,s.box+1); }
      else { s.ko++; s.box=0; if(Q.rep[k]!=null) s.last=it.idx[Q.rep[k]]; }
    });
  }

  /* décompte par matière */
  var parMat={};
  Q.liste.forEach(function(it,k){
    var m=it.ref.mat;
    if(!parMat[m]) parMat[m]={n:0,ok:0,ko:0,vide:0};
    parMat[m].n++;
    if(Q.rep[k]===null) parMat[m].vide++;
    else if(Q.rep[k]===it.bonne) parMat[m].ok++;
    else parMat[m].ko++;
  });

  var totalOk=0, total=Q.liste.length;
  Object.keys(parMat).forEach(function(m){ totalOk+=parMat[m].ok; });

  /* note pondérée /20 sur les 4 matières officielles */
  var num=0, den=0;
  ["maths","physique","francais","anglais"].forEach(function(m){
    var p=parMat[m]; if(!p) return;
    var brut = p.ok - (Q.malus ? 0.25*p.ko : 0);
    var n20 = Math.max(0, 20*brut/p.n);
    num += MAT[m].coef*n20; den += MAT[m].coef;
  });
  var note = den? num/den : null;

  S.sessions.push({date:todayISO(), mode:Q.mode, lib:Q.lib,
    score:totalOk, total:total, note:note});
  if(S.sessions.length>60) S.sessions=S.sessions.slice(-60);
  save();

  dessinerResultats(parMat, totalOk, total, note);
}

function dessinerResultats(parMat, totalOk, total, note){
  var v=document.getElementById(Q.cible); v.innerHTML="";
  var c=el("div","card");
  c.appendChild(el("div","eyebrow","Résultat · "+Q.lib));

  var top=el("div","row"); top.style.cssText="align-items:flex-end; gap:20px; margin:8px 0 4px";

    sc.innerHTML='<div class="score-big"><b>0,00</b><small> / 20</small></div>'+
      '<div class="sub">note pondérée par les coefficients</div>';
    anime(sc.querySelector("b"), note, function(x){ return x.toFixed(2).replace(".", ","); });
  }else{
    sc.innerHTML='<div class="score-big">'+totalOk+'<small> / '+total+'</small></div>';
  }
  top.appendChild(sc);
  var pct=Math.round(100*totalOk/total);
  var vd = pct>=65 ? ["v-ok","Bonne trajectoire"] : pct>=50 ? ["v-mid","Encore fragile"] : ["v-bad","À retravailler"];
  var vdd=el("div"); vdd.innerHTML='<span class="verdict '+vd[0]+'">'+vd[1]+'</span>'+
    '<div class="sub" style="margin-top:6px">'+totalOk+' bonnes réponses sur '+total+' ('+pct+' %)</div>';
  top.appendChild(vdd);
  c.appendChild(top);

  var tw=el("div","tw"); tw.style.marginTop="16px";
  var t=el("table","res");
  /* en-têtes courts sur téléphone : le tableau tient sans défilement */
  t.innerHTML="<thead><tr><th>Matière</th><th class='n'>Coef</th>"+
    "<th class='n' title='Justes'><span class='sh'>✓</span><span class='lg'>Justes</span></th>"+
    "<th class='n' title='Fausses'><span class='sh'>✗</span><span class='lg'>Fausses</span></th>"+
    "<th class='n' title='Sans réponse'><span class='sh'>Vide</span><span class='lg'>Sans réponse</span></th>"+
    "<th class='n'><span class='sh'>/20</span><span class='lg'>Note /20</span></th></tr></thead>";
  var tb=el("tbody");
  ORDRE.forEach(function(m){
    var p=parMat[m]; if(!p) return;

    tr.innerHTML="<td>"+(m==="maths"?"<span class='sh'>Maths</span><span class='lg'>"+MAT[m].nom+"</span>":MAT[m].nom)+"</td><td class='n'>"+(MAT[m].coef||"—")+"</td>"+
      "<td class='n'>"+p.ok+"</td><td class='n'>"+p.ko+"</td><td class='n'>"+p.vide+"</td>"+
      "<td class='n'>"+n20.toFixed(2)+"</td>";
    tb.appendChild(tr);
  });
  t.appendChild(tb); tw.appendChild(t); c.appendChild(tw);
  if(Q.malus) c.appendChild(el("p","sub","Malus de −0,25 point par mauvaise réponse appliqué."));

  var nv=el("div","qnav");
  var b1=el("button","btn","Retour au tableau de bord"); b1.type="button";
  b1.addEventListener("click",function(){ go("bord"); }); nv.appendChild(b1);
  var rat=[]; Q.liste.forEach(function(it,k){ if(Q.rep[k]!==it.bonne) rat.push(it.ref); });
  if(rat.length){
    var b2=el("button","btn ghost","Refaire les "+rat.length+" ratées"); b2.type="button";
    b2.addEventListener("click",function(){
      demarrer({mode:"train", lib:"Rattrapage", liste:shuffle(rat).map(prepare), duree:0, cible:Q.cible});
    });
    nv.appendChild(b2);
  }
  c.appendChild(nv);
  v.appendChild(c);

  /* correction détaillée */
  if(rat.length){
    var cc=el("div","card");
    cc.appendChild(el("div","eyebrow","Correction"));
    cc.appendChild(el("h2","","Les "+rat.length+" question"+(rat.length>1?"s":"")+" manquée"+(rat.length>1?"s":"")));
    var list=el("div","rev"); list.style.marginTop="12px";
    Q.liste.forEach(function(it,k){
      if(Q.rep[k]===it.bonne) return;
      var d=el("div","rev-item");
      d.appendChild(el("div","q","<span class='tag'>"+MAT[it.ref.mat].court+"</span> "+
        "<span class='tag'>"+it.ref.ch+"</span> "+mathify(it.ref.q)));
      d.appendChild(blocCorrection(it, Q.rep[k], false));
      list.appendChild(d);
    });
    cc.appendChild(list);
    v.appendChild(cc);
  }
}

/* Une ligne de fiche qui enchaine plusieurs formules separees par « ; »
   est eclatee en blocs distincts : bien plus lisible qu'un pave. */
/* Un bloc est \u00ab formulaire \u00bb quand la moitie au moins de ses lignes portent une
   relation et qu'aucune ne cite du texte : tout le bloc adopte alors la meme
   presentation, au lieu de melanger encadres et puces. */
function blocFormule(lignes){
  var n = 0, cite = false;
  lignes.forEach(function(l){
    var brut = l.replace(/<[^>]*>/g, "");
    if(/[=\u2192\u21d2\u21d4]/.test(brut)) n++;
    if(brut.indexOf("\u00ab") >= 0) cite = true;
  });
  return !cite && n * 2 >= lignes.length;
}

/* Tableau de fiche : première ligne et première colonne servent d'en-têtes. */
function tableFiche(t){
  var w=el("div","tw");
  var h="<thead><tr>"+t.h.map(function(x){ return "<th>"+mathify(x)+"</th>"; }).join("")+"</tr></thead><tbody>";
  var seule = t.r.length === 1;          /* une seule ligne (préfixes) : pas d'en-tête de ligne */
  t.r.forEach(function(r){
    h+="<tr>"+r.map(function(x,i){
      return (i===0 && !seule) ? "<th scope='row'>"+mathify(x)+"</th>" : "<td>"+mathify(x)+"</td>";
    }).join("")+"</tr>";
  });
  var tb=el("table","fiche-tab"); tb.innerHTML=h+"</tbody>";
  w.appendChild(tb);
  return w;
}

/* Découpe une ligne de formules sur « ; » sans couper à l'intérieur d'une
   parenthèse : « ℬ(n ; p) » ou « G(x̄ ; ȳ) » restent entiers. */
function decoupe(s){
  var out = [], d = 0, cur = "";
  for(var i = 0; i < s.length; i++){
    var c = s.charAt(i);
    if(c === "(") d++;
    else if(c === ")" && d > 0) d--;
    if(d === 0 && s.substr(i, 3) === " ; "){ out.push(cur); cur = ""; i += 2; continue; }
    cur += c;
  }
  out.push(cur);
  return out;
}

function ligneFiche(src, formule){
  var li = el("li");
  var parts = decoupe(src);
  if(!formule){ li.innerHTML = mathify(src); return li; }
  li.className = "fxi";
  var g = el("div", "fxg");
  var court = true;
  parts.forEach(function(x){
    if(x.replace(/<[^>]*>/g, "").length > 34) court = false;
    g.appendChild(el("div", "fx", mathify(x.trim())));
  });
  if(court && parts.length > 1) g.className = "fxg duo";
  li.appendChild(g);
  return li;
}

  tw.appendChild(t); c1.appendChild(tw);

  v.appendChild(c1);

  var c2=el("div","card");
  c2.appendChild(el("div","eyebrow","Contenu de l'application"));
  c2.appendChild(el("h2","","Ce que contient la banque"));
  var tw2=el("div","tw"); tw2.style.marginTop="12px";
  var t2=el("table","res");
  t2.innerHTML="<thead><tr><th>Matière</th><th class='n'>Questions</th><th class='n'>Chapitres</th></tr></thead><tbody>"+
    ORDRE.map(function(m){
      var qs=all(m), chs=[]; qs.forEach(function(q){ if(chs.indexOf(q.ch)<0) chs.push(q.ch); });
      return "<tr><td>"+MAT[m].nom+"</td><td class='n'>"+qs.length+"</td><td class='n'>"+chs.length+"</td></tr>";
    }).join("")+"<tr><td><b>Total</b></td><td class='n'><b>"+every().length+"</b></td><td class='n'></td></tr></tbody>";

  c2.appendChild(el("p","sub","Les questions suivent les programmes officiels sénégalais de Terminale S2 (mathématiques, Office du Baccalauréat) et de Terminale S1/S2 (sciences physiques), complétés par les thèmes réellement rencontrés dans les épreuves QCM d'entrée aux écoles d'ingénieurs du Sénégal : circuits électriques, optique géométrique, ondes."));
  v.appendChild(c2);

  var c3=el("div","card");

  c3.appendChild(el("h2","","Exporter ou restaurer ta progression"));
  c3.appendChild(el("p","sub","Ta progression est enregistrée dans ce navigateur uniquement. Copie ce texte dans un fichier pour la conserver, ou colle une sauvegarde puis clique sur Restaurer."));
  var ta=el("textarea"); ta.id="io"; ta.value=JSON.stringify(S);
  ta.style.marginTop="12px"; c3.appendChild(ta);
  var rr=el("div","row"); rr.style.marginTop="10px";
  var bc=el("button","btn sm","Copier"); bc.type="button";
  bc.addEventListener("click",function(){
    ta.select(); try{ document.execCommand("copy"); bc.textContent="Copié ✓";
      setTimeout(function(){bc.textContent="Copier";},1600); }catch(e){}
  });
  var br=el("button","btn ghost sm","Restaurer"); br.type="button";
  br.addEventListener("click",function(){
    try{
      var p=JSON.parse(ta.value);
      if(!p||typeof p!=="object") throw 0;
      S.stats=p.stats||{}; S.sessions=p.sessions||[]; S.plan=p.plan||{}; S.theme=p.theme||null;
      S.session=p.session||null;
      save(); applyTheme(); alert("Progression restaurée."); go("bord");
    }catch(e){ alert("Ce texte n'est pas une sauvegarde valide."); }
  });
  var bz=el("button","btn ghost sm","Tout effacer"); bz.type="button";
  bz.addEventListener("click",function(){
    if(!confirm("Effacer toute ta progression ? C'est irréversible.")) return;
    S.stats={}; S.sessions=[]; S.plan={}; S.session=null; save(); go("bord");
  });
  rr.appendChild(bc); rr.appendChild(br); rr.appendChild(bz);

   ["ESP — L1 Génie Logiciel & Systèmes d'Information","https://esp.sn/formations/diplome-superieur-de-technologie-dst-en-informatique/"],
   ["ESP — communiqué sur les épreuves du concours DIC","https://esp.sn/"]]
  .forEach(function(x){
    var a=el("a",null,x[0]); a.href=x[1]; a.target="_blank"; a.rel="noopener";
    var d=el("div"); d.appendChild(a); s.appendChild(d);
  });
  c4.appendChild(s);

  v.appendChild(c4);
};

go("bord");

})();
